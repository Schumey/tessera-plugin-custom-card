# What tools/preview.py of the tessera-plugins repository shows (its docs/PREVIEW.md): a room's climate as two arcs, a
# computer's load as three arcs in a row, a room's climate with icons, colours and a bar, two counts with a share, a card whose value is a word,
# eight rooms in two rows of four, and eight rooms as lines of text. Never put a secret here.
tiles:
  - tile: card
    name: Bedroom
    entity: sensor.bedroom_card
  - tile: card
    name: Computer
    entity: sensor.computer_card
    sizes: [2x1, 2x2, 4x2]
  - tile: card
    name: Living room
    entity: sensor.living_room_card
  - tile: card
    name: Entrance
    entity: sensor.entrance_card
  - tile: card
    name: Front door
    entity: sensor.front_door_card
    sizes: [1x1, 2x1, 2x2]
  - tile: card
    name: Rooms
    entity: sensor.rooms_card
    sizes: [2x2, 3x2, 4x2, 4x4]
  - tile: card
    name: House
    entity: sensor.house_card
    sizes: [1x2, 2x2, 3x2, 3x3]

states:
  sensor.bedroom_card:
    state: "13"
    attributes:
      unit_of_measurement: °C
      elements:
        - "arc|13|°C|Auto|orange|thermometer|5|30"
        - "arc|58|%|Humidity|green|water-percent|0|100"
  sensor.computer_card:
    state: "5"
    attributes:
      elements:
        - "arc|5|%|CPU|green"
        - "arc|1|%|GPU|green"
        - "arc|40|%|RAM|green"
  sensor.living_room_card:
    state: "823"
    attributes:
      unit_of_measurement: ppm
      elements:
        - "value|19,6|°C|Temperature|blue|thermometer"
        - "value|46|%|Humidity|green|water-percent"
        - "bar|823|ppm|CO2|yellow|molecule-co2|400|2000"
  sensor.entrance_card:
    state: "8704"
    attributes:
      elements:
        - "value|8.704||Scanned"
        - "value|12.499||Valid"
        - "bar|70|%|Share|blue||0|100"
  sensor.front_door_card:
    state: "open"
    attributes:
      elements:
        - "value|open||Lock|red|lock-open-variant"
        - "value|21,4|°C|Hall||thermometer"
        - "text|Window kitchen open||||window-open-variant"
  sensor.rooms_card:
    state: "21,2"
    attributes:
      elements:
        - "value|21,2|°C|Living"
        - "value|20,4|°C|Kitchen"
        - "value|18,1|°C|Bedroom"
        - "value|22,0|°C|Bath"
        - "value|19,5|°C|Office"
        - "value|20,8|°C|Kids"
        - "value|16,3|°C|Hall"
        - "value|12,7|°C|Cellar|blue"
  sensor.house_card:
    state: "17.8"
    attributes:
      elements:
        - "text|Entrance: 20,8 °C"
        - "text|Kitchen: 21,8 °C"
        - "text|Bedroom: 20,8 °C"
        - "text|Bath: 20,5 °C"
        - "text|Dining: 20,7 °C"
        - "text|Living: 20,4 °C"
        - "text|Attic: 22,7 °C"
        - "text|Outside: 17,8 °C"

cards:
  - { card: detail, entity: sensor.bedroom_card }
